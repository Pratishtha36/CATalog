services:
  - type: web
    name: catalog-api
    runtime: python
    # Application data and trained phone models persist in Supabase.
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false

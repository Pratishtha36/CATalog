services:
  - type: web
    name: catalog-api
    runtime: python
    # Temporary demo only: this plan has no persistent disk.
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: CORS_ORIGINS
        sync: false
